[workspace]
resolver = "2"
members = [
    "crates/twin-core",
    "crates/twin-hub",
    "crates/twin-collector",
    "app/src-tauri",
]
# The Tauri app needs platform GUI libraries (WebView2 on Windows, webkit2gtk on
# Linux), so it is excluded from the default build set. Build it explicitly with
# `cargo tauri dev` / `cargo tauri build` from `app/`.
default-members = [
    "crates/twin-core",
    "crates/twin-hub",
    "crates/twin-collector",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
twin-core = { path = "crates/twin-core" }
twin-hub = { path = "crates/twin-hub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
notify = "8"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = { version = "0.3", default-features = false }
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
